# Настройки Spring Boot
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# =========================
# Server
# =========================
server.port=8080
# =========================
# Datasource
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/java_graduate_work
spring.datasource.username=java_user
spring.datasource.password=java
spring.datasource.driver-class-name=org.postgresql.Driver
# =========================
# JPA
# =========================
# Hibernate ddl auto (create, create-drop, validate, update, none)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# =========================
# SECURITY
# =========================
security.min-password-length=6

# ============================================
# ЗАГРУЗКА ФАЙЛОВ
# Максимальный размер
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# =========================
# LIQUIBASE
# =========================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# === LOGGING ===
logging.level.root=INFO
logging.level.ru.skypro=DEBUG
logging.level.org.springframework.boot.autoconfigure.liquibase=DEBUG
logging.level.liquibase=DEBUG

# =========================
# ALFRESCO
# =========================
alfresco.url=http://localhost:9090/alfresco
alfresco.username=admin
alfresco.password=admin
# nodeId заранее созданной папки storage для хранения аватарок и картинок объявлений
alfresco.folder-id=e60b9e68-2623-4622-8b9e-682623c62269

# =========================
# SWAGGER
# =========================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

